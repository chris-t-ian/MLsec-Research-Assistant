# Non-secret application settings. Secrets live in .env (see .env.example).
# Model IDs are OpenRouter model slugs (https://openrouter.ai/models).

models:
  main: anthropic/claude-sonnet-5.5
  judge: google/gemini-3.5-flash
  fallback: openai/gpt-4.1-mini

llm:
  base_url: https://openrouter.ai/api/v1
  timeout_s: 60
  max_retries: 3
  temperature: 0.0

paths:
  raw_dir: data/raw
  index_dir: data/index
  papers_file: data/papers.yaml
  processed_dir: data/processed

limits:
  max_question_chars: 2000

retrieval:
  top_k: 8
  bm25_weight: 0.5
  dense_weight: 0.5
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

chunking:
  # Sizes in tokens; tiktoken cl100k_base is used as an approximation for all models.
  max_tokens: 800
  overlap_tokens: 100
  encoding: cl100k_base

arxiv:
  api_url: https://export.arxiv.org/api/query
  eprint_url: https://export.arxiv.org/e-print
  pdf_url: https://export.arxiv.org/pdf
  min_interval_s: 3.0  # arXiv rule: at most one request every 3 s (validated >= 3)
  timeout_s: 60
  max_retries: 3
  backoff_s: 3
  max_download_mb: 100
  max_extract_mb: 500

logging:
  level: INFO
