# Non-secret application settings. Secrets live in .env (see .env.example).
# Model IDs are OpenRouter model slugs (https://openrouter.ai/models).

models:
  main: anthropic/claude-sonnet-5.5
  judge: google/gemini-3.8-flash
  fallback: openai/gpt-4.1-mini
  # Additional models offered in the UI model setting (main and fallback are always offered).
  selectable: []

llm:
  base_url: https://openrouter.ai/api/v1
  timeout_s: 60
  max_retries: 3
  temperature: 0.0
  max_tokens: 8192      # output cap per call; also caps OpenRouter's per-request credit reservation
  prompt_cache: true    # automatic prompt caching in the agent tool loop (anthropic/* models)

paths:
  raw_dir: data/raw
  index_dir: data/index
  papers_file: data/papers.yaml
  processed_dir: data/processed
  strategies_file: config/strategies.yaml
  cache_dir: data/cache
  audit_log: data/logs/tool_audit.jsonl
  chat_db: data/chainlit.db  # Chainlit chat history (create with scripts/init_db.py)

limits:
  max_question_chars: 2000

retrieval:
  top_k: 8
  bm25_weight: 0.5
  dense_weight: 0.5
  # Local sentence-transformers model; embeddings are L2-normalized (cosine similarity).
  # Changing the model requires `uv run python scripts/ingest.py --rebuild`.
  embedding_model: BAAI/bge-small-en-v1.5
  query_instruction: "Represent this sentence for searching relevant passages: "
  embedding_batch_size: 32
  collection_name: chunks
  # Cross-encoder for strategies with rerank: true (see config/strategies.yaml).
  reranker_model: BAAI/bge-reranker-base
  # Reranker input length in tokens (query + chunk); 256 keeps CPU reranking affordable.
  reranker_max_length: 256
  reranker_batch_size: 16
  rrf_k: 60

chunking:
  # Sizes in tokens; tiktoken cl100k_base is used as an approximation for all models.
  max_tokens: 800
  overlap_tokens: 100
  encoding: cl100k_base

arxiv:
  api_url: https://export.arxiv.org/api/query
  eprint_url: https://export.arxiv.org/e-print
  pdf_url: https://export.arxiv.org/pdf
  min_interval_s: 3.0  # arXiv rule: at most one request every 3 s (validated >= 3)
  timeout_s: 60
  max_retries: 3
  backoff_s: 3
  max_download_mb: 100
  max_extract_mb: 500

semantic_scholar:
  api_url: https://api.semanticscholar.org/graph/v1
  timeout_s: 30
  max_retries: 4
  backoff_s: 2          # exponential backoff base on 429 / 5xx / timeouts
  min_interval_s: 1.0   # keyed access: 1 request per second
  cache_ttl_h: 24       # citation_graph disk cache lifetime

generation:
  # Spotlighting: sources are always wrapped in delimiters with a random per-request boundary.
  # datamarking: true additionally interleaves datamark_char into the source text (red-team
  # comparison); default "ˆ" (U+02C6).
  datamarking: false
  datamark_char: "\u02C6"
  excerpt_chars: 300

agent:
  # Strategy name from config/strategies.yaml used by search_knowledge_base (rerank
  # strategies are slow on CPU, see retrieval.reranker_model).
  default_strategy: hybrid
  history_turns: 6            # completed earlier turns passed to the model
  max_tool_calls_per_turn: 6  # hard cap (validated <= 6)
  max_agent_steps: 6          # agent model calls per turn
  max_tool_result_chars: 6000

security:
  max_token_chars: 200        # reject single whitespace-free tokens longer than this
  injection:
    warn_threshold: 0.4
    block_threshold: 0.8
    # Optional classifier on top of the heuristics (Apache-2.0, not gated; checked
    # 2026-11-21 on huggingface.co). Downloaded on first use.
    classifier_enabled: false
    classifier_model: protectai/deberta-v3-base-prompt-injection-v2
    classifier_max_length: 512

logging:
  level: INFO
