# Retrieval strategies, loaded by research_assistant.retrieval.strategies.load_strategies.
# Fields: name, query_translation (none | multi_query | hyde | decompose), use_filters,
# retriever (dense | bm25 | hybrid), rerank, fetch_k (candidates per ranked list),
# top_k (chunks returned), rerank_k (fused candidates per group scored by the reranker;
# top_k <= rerank_k <= fetch_k), max_chunks_per_paper. `defaults` apply to every strategy.

defaults:
  fetch_k: 30
  top_k: 8
  rerank_k: 15
  # 2 (was 3): leaves room for more different papers; more gold papers found in every
  # strategy on dev (eval/results/tuning-20261123-102932) at no extra context tokens.
  max_chunks_per_paper: 2

strategies:
  - name: baseline_dense
    query_translation: none
    use_filters: false
    retriever: dense
    rerank: false

  # baseline_dense with the parameters tuned on dev (eval/results/tuning-20261123-102932:
  # 0.46 -> 0.62 gold papers found). Not checked on the test split. App default
  # (agent.default_strategy); baseline_dense itself stays unchanged as the eval reference.
  - name: baseline_dense_tuned
    query_translation: none
    use_filters: false
    retriever: dense
    rerank: false
    top_k: 12

  - name: hybrid
    query_translation: none
    use_filters: false
    retriever: hybrid
    rerank: false

  - name: hybrid_multiquery
    query_translation: multi_query
    use_filters: false
    retriever: hybrid
    rerank: false

  - name: hybrid_hyde_rerank
    query_translation: hyde
    use_filters: false
    retriever: hybrid
    rerank: true

  - name: full
    query_translation: multi_query
    use_filters: true
    retriever: hybrid
    rerank: true

  # `full` tuned retrieval-only on the dev split (eval/tune_retrieval.py, run
  # tuning-20261123-102932): more chunks and more reranked candidates. Confirmed against
  # `full` on test (confirm-20261123-132343: +0.10 [0.06, 0.15] gold papers found), not
  # against baseline_dense (+0.07 [-0.04, 0.17]).
  - name: full_tuned
    query_translation: multi_query
    use_filters: true
    retriever: hybrid
    rerank: true
    top_k: 12
    rerank_k: 30
