[project]
name = "research-assistant"
version = "0.1.0"
description = "Cited research assistant for ML privacy & security papers"
authors = [
    { name = "cschneider", email = "schneider.chris.j@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chainlit>=2.12.0",
    "chromadb>=1.5.9",
    "dp-accounting>=0.6.0",
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "langchain-core>=1.8.3",
    "langchain-openai>=1.8.3",
    "langgraph>=1.2.24",
    "matplotlib>=3.11.2",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pylatexenc>=2.11",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Development happens on an Intel Mac: make `uv lock` fail early (or pick older versions)
# when a dependency has no wheel for it, instead of breaking `uv sync` later.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version == '3.12'"]
# cryptography (via pdfminer.six) ships no Intel-mac wheels after 48.0.1; building it
# needs a Rust toolchain. uv's universal lock then resolves 48.0.1 for all platforms.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # PyTorch ships no Intel-mac wheels after 2.2.2, and those are built against NumPy 1.x.
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # transformers 5 needs torch >= 2.4 (fails at import with torch 2.2); sentence-transformers 6
    # needs transformers 5.
    "sentence-transformers<6; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # onnxruntime (via chromadb) has no Intel-mac wheels after 1.23.x.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]  # app modules import each other by name, as under Chainlit
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs network or API keys (deselected by default)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
