[project]
name = "research-assistant"
version = "0.1.0"
description = "Cited research assistant for ML privacy & security papers"
authors = [
    { name = "cschneider", email = "schneider.chris.j@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-core>=1.8.3",
    "langchain-openai>=1.8.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pylatexenc>=2.11",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Development happens on an Intel Mac: make `uv lock` fail early (or pick older versions)
# when a dependency has no wheel for it, instead of breaking `uv sync` later.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
# cryptography (via pdfminer.six) ships no Intel-mac wheels after 48.0.1; building it
# needs a Rust toolchain. uv's universal lock then resolves 48.0.1 for all platforms.
constraint-dependencies = [
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs network or API keys (deselected by default)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
