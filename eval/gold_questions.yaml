  - '2410.05451'
  - '2404.13208'
  - '2507.02735'
  - '2510.09023'
  - '2503.00061'
  key_facts:
  - StruQ separates instructions and data with reserved delimiters and structured instruction tuning.
  - SecAlign uses preference optimization to prefer responses that ignore injected instructions.
  - Instruction hierarchy trains models to prioritize system over user over tool content.
  - An adaptive evaluation bypassed 12 recent defenses with attack success above 90% for most, although most originally reported near-zero success.
  notes: 'orig_tags: sota, crit; facts: partial (numbers checked, rest from memory)'
- id: 45
  question: How do system-level defenses (CaMeL, dual-LLM pattern, spotlighting) work, and what are their trade-offs?
  type: comparison
  topic: prompt_injection
  split: dev
  gold_arxiv_ids:
  - '2503.18813'
  - '2403.14720'
  - '2506.08837'
  key_facts:
  - CaMeL separates control flow (privileged LLM) from untrusted data (quarantined LLM) and enforces capability-based policies.
  - The dual-LLM pattern keeps untrusted content away from the LLM that can call tools.
  - Spotlighting marks untrusted input (delimiting, datamarking, encoding); it is cheap but not robust to adaptive attacks.
  - Isolation-based designs give principled guarantees at a utility cost.
  notes: 'orig_tags: comp; facts: memory (verify against papers); Dual-LLM pattern (Willison blog) is not in the corpus.'
