- id: 40
  question: How does DP bound reconstruction risk, compared with its bounds on membership inference?
  type: method
  topic: model_inversion
  split: test
  gold_arxiv_ids:
  - '2201.12383'
  - '2302.07225'
  - '2307.03928'
  - '2202.07623'
  - '2507.06969'
  - '2609.37344'
  key_facts:
  - Reconstruction is a harder task than membership inference.
  - A given epsilon bounds reconstruction success more strongly than membership inference success.
  - DP models can therefore protect against reconstruction at epsilon values too large for meaningful MIA protection.
  notes: 'orig_tags: def; facts: memory (verify against papers)'
